name: Deploy catalog demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Репозиторий содержит уже собранный catalog.html: блоки catalog.*.js
      # остаются в исходном проекте и в публичный репозиторий не выкладываются.
      # Сборку проверяем до push — deploy-github.js не пустит несобранный файл.
      - name: Verify bundle is built
        run: |
          test -s catalog.html
          grep -q 'BUILD:SCRIPT' catalog.html
          echo "catalog.html: $(wc -c < catalog.html) bytes"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
